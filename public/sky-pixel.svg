<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" shape-rendering="crispEdges">
  <!-- TREND RADAR 배경: 하늘·구름·픽셀 잔디·픽셀 스티커. 직접 그린 일러스트(외부 이미지·상표 없음). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7cf2"/>
      <stop offset=".38" stop-color="#7fb4fb"/>
      <stop offset=".66" stop-color="#cfe5ff"/>
      <stop offset="1" stop-color="#f4f8ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd34a"/><stop offset=".5" stop-color="#3fb83a"/><stop offset="1" stop-color="#2a9a2e"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <g id="cloud" filter="url(#soft)" shape-rendering="auto">
      <ellipse cx="0" cy="20" rx="150" ry="38" fill="#fff"/>
      <ellipse cx="-60" cy="0" rx="60" ry="44" fill="#fff"/>
      <ellipse cx="20" cy="-18" rx="76" ry="56" fill="#fff"/>
      <ellipse cx="90" cy="6" rx="56" ry="40" fill="#fff"/>
    </g>
    <!-- 픽셀 하트(8px 격자) -->
    <g id="heart">
      <path d="M8 0h16v8H8zM40 0h16v8H40zM0 8h32v8H0zM32 8h32v8H32zM0 16h64v16H0zM8 32h48v8H8zM16 40h32v8H16zM24 48h16v8H24z" fill="#ff5fae"/>
      <path d="M8 8h8v8H8z" fill="#fff" opacity=".85"/>
    </g>
    <!-- 픽셀 반짝이 -->
    <g id="sparkle">
      <path d="M16 0h8v16h-8zM16 24h8v16h-8zM0 16h16v8H0zM24 16h16v8H24z" fill="#f6ff3a"/>
      <path d="M16 16h8v8h-8z" fill="#fff"/>
    </g>
    <pattern id="grassTex" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="none"/>
      <rect x="0" y="0" width="8" height="8" fill="#ffffff" opacity=".08"/>
      <rect x="8" y="8" width="8" height="8" fill="#0b5a12" opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <use href="#cloud" transform="translate(260 170)"/>
  <use href="#cloud" transform="translate(820 110) scale(.8)"/>
  <use href="#cloud" transform="translate(1300 230) scale(1.2)"/>
  <use href="#cloud" transform="translate(560 420) scale(1.1)"/>
  <use href="#cloud" transform="translate(1520 470) scale(.9)"/>
  <use href="#cloud" transform="translate(70 520) scale(.8)"/>

  <!-- 계단식 픽셀 잔디 -->
  <path d="M0 760h96v-16h112v-16h128v16h96v16h160v-16h144v-16h176v16h128v16h112v-16h160v-16h112v16h176v-16h0V1000H0Z" fill="url(#grass)"/>
  <path d="M0 760h96v-16h112v-16h128v16h96v16h160v-16h144v-16h176v16h128v16h112v-16h160v-16h112v16h176v-16h0V1000H0Z" fill="url(#grassTex)"/>
  <path d="M0 880h208v-16h240v16h320v-16h256v16h304v-16h272V1000H0Z" fill="#2f9e30" opacity=".55"/>

  <!-- 픽셀 스티커: 화면 가장자리에만 -->
  <use href="#heart" transform="translate(56 300)"/>
  <use href="#heart" transform="translate(1500 640) scale(.75)"/>
  <use href="#sparkle" transform="translate(1480 120)"/>
  <use href="#sparkle" transform="translate(120 660) scale(.75)"/>
  <use href="#sparkle" transform="translate(1540 360) scale(.6)"/>
</svg>
